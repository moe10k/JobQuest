<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register_login.css">
    <title> Login </title>
    <style>

        /* Style for error and valid input fields */
        .error {
            border-color: red;
            background-color: #f8d7da;
        }
        .valid {
            border-color: green;
            background-color: #d4edda;
        }

        /* Style for forgot password popup */
        .modal {
        display: none; 
        position: fixed; 
        z-index: 1000; 
        left: 0;
        top: 0;
        width: 100%; 
        height: 100%; 
        overflow: none;
        background-color: rgba(0, 0, 0, 0.5); /* Black with opacity */
    }
    .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 90%;
        max-width: 25%;
        text-align: center;
    }
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    }

    /* Dark mode styling */
    .dark-mode {
        background-color: #1a1a24;
        color: #f4f5f7;
    }
    .dark-mode .modal-content {
        background-color: #333;
        color: #f4f5f7;
        border: 1px solid #555;
    }
    .dark-mode .modal-content .close {
        color: #f4f5f7;
    }
    .dark-mode .modal-content .close:hover,
    .dark-mode .modal-content .close:focus {
        color: #ddd;
    }

    </style>
</head>

<body>

    <!-- nav bar section -->
    {% include 'partials/nav.html' %}

    <!-- Flash message section -->
    {% include 'partials/flash.html' %}


    <div class="container">
        <div class ="box">
        <h2>Login</h2>
        <form id="loginForm" action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
                <span id = "togglePassword" style="cursor: pointer; color: #6f42c1; text-decoration: underline;">Show Password</span>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/register">Register</a></p>
        <p><a href="#" id = "forgotPasswordLink">Forgot Password?</a></p>
        </div>
    </div>

    <!-- Forgot password popup -->
     <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close" id = "closeForgotPasswordModal">&times;</span>
            <h2>Forgot Password</h2>
            <p>Enter your email to receive reset instructions:</p>
            <form id="forgotPasswordForm" action="/forgot_password" method="POST">
                <div class="form-group">
                    <!-- <label for="forgotEmail">Email</label>   -->
                    <input type="email" name="forgotEmail" id="forgotEmail" required>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        let isValid = true;

        //  Get form field
        const passwordField = document.getElementById('password');
        const emailField = document.getElementById('email');
        const emailPattern = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/; //regex

        // Reset classes
        emailField.classList.remove('error', 'valid');
        passwordField.classList.remove('error', 'valid');

        //Validate password length
        if (passwordField.value.length < 6) { //if password is less than 6 characters then it is an error
            passwordField.classList.add('error');
            isValid = false;
        } else {
            passwordField.classList.add('valid');
        }

        //Validate email pattern
        if (!emailPattern.test(emailField.value)) {
            emailField.classList.add('error');
            isValid = false;
        } else {
            emailField.classList.add('valid');
        }

        // // Prevents form from being submitted if any validation check fails.
        // if (!isValid) {
        //     event.preventDefault(); 
        // }
    });

    // Forgot password popup
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const closeForgotPasswordModal = document.getElementById('closeForgotPasswordModal');

    forgotPasswordLink.onclick = function() {
        forgotPasswordModal.style.display = 'block';
    }

    closeForgotPasswordModal.onclick = function() {
        forgotPasswordModal.style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target == forgotPasswordModal) {
            forgotPasswordModal.style.display = 'none';
        }
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const isPasswordVisible = passwordField.type === 'text';
            passwordField.type = isPasswordVisible ? 'password' : 'text';
            this.textContent = isPasswordVisible ? 'Show Password' : 'Hide Password'; // Toggle the text
        });

    function flashMessage(message, category) {
        const flashContainer = document.getElementById('frontend-flash');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('alert', 'alert-${category}');
        messageDiv.innerText = message;
        flashContainer.appendChild(messageDiv);
    }

    // Define primary and backup server URLs
    const primaryUrl = "http://10.147.17.11:7012/login"; // Primary server URL
    const backupUrl = "http://10.147.17.65:7012/login"; // Backup server URL

    // Track current server state
    let isOnPrimary = window.location.href.startsWith(primaryUrl);
    let isOnBackup = window.location.href.startsWith(backupUrl);

    // Function to check the status of the primary and backup servers
    async function checkServerStatus() {
        try {
            // Attempt to check the primary server's status
            const primaryResponse = await fetch(primaryUrl, {
                method: "GET", 
                mode: "no-cors",  // Set to no-cors mode to avoid CORS-related issues
                cache: "no-store", // Avoid cached responses
            });

            // If the primary server is online, handle redirection
            if (primaryResponse.ok || primaryResponse.status === 200) {
                console.log("Primary server is online.");
                // Redirect to primary if user is on backup
                if (isOnBackup) {
                    console.log("Redirecting back to the primary server.");
                    window.location.href = primaryUrl; // Use href for hard reload
                }
                isOnPrimary = true;
                isOnBackup = false;
            } else {
                console.warn("Primary server is down (unexpected response).");
                switchToBackup();
            }
        } catch (error) {
            // Handle network errors or fetch failures for primary server
            console.error("Primary server is unreachable:", error);
            switchToBackup();
        }

        // Check if the backup server is online
        try {
            const backupResponse = await fetch(backupUrl, {
                method: "GET", 
                mode: "no-cors",  // Set to no-cors mode for backup server
                cache: "no-store", 
            });

            if (backupResponse.ok || backupResponse.status === 200) {
                console.log("Backup server is online.");
                // If user is on backup and it's reachable, do nothing
                if (!isOnBackup) {
                    switchToBackup();
                }
            } else {
                console.warn("Backup server is down (unexpected response).");
                // Redirect to primary if backup is down and user is on backup
                if (isOnBackup) {
                    console.log("Backup is down, redirecting to primary server.");
                    window.location.href = primaryUrl; // Use href for hard reload
                }
            }
        } catch (error) {
            // Handle network errors or fetch failures for backup server
            console.error("Backup server is unreachable:", error);
            // Redirect to primary if backup is down and user is on backup
            if (isOnBackup) {
                console.log("Backup is down, redirecting to primary server.");
                window.location.href = primaryUrl; // Use href for hard reload
            }
        }
    }

    // Function to redirect to the backup server
    function switchToBackup() {
        if (!isOnBackup) {
            console.log("Switching to the backup server.");
            window.location.href = backupUrl; // Hard reload to backup
        }
        isOnPrimary = false;
        isOnBackup = true;
    }

    // Poll the server status every 7 seconds
    setInterval(checkServerStatus, 7000);

    // Initial check when the page loads
    window.onload = checkServerStatus;

</script>
</body>

</html>
