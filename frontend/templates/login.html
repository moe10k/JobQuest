<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register_login.css">
    <title> Login </title>
    <style>

        /* Style for error and valid input fields */
        .error {
            border-color: red;
            background-color: #f8d7da;
        }
        .valid {
            border-color: green;
            background-color: #d4edda;
        }

        /* Style for forgot password popup */
        .modal {
        display: none; 
        position: fixed; 
        z-index: 1000; 
        left: 0;
        top: 0;
        width: 100%; 
        height: 100%; 
        overflow: none;
        background-color: rgba(0, 0, 0, 0.5); /* Black with opacity */
    }
    .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 90%;
        max-width: 25%;
        text-align: center;
    }
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    }

    /* Dark mode styling */
    .dark-mode {
        background-color: #1a1a24;
        color: #f4f5f7;
    }
    .dark-mode .modal-content {
        background-color: #333;
        color: #f4f5f7;
        border: 1px solid #555;
    }
    .dark-mode .modal-content .close {
        color: #f4f5f7;
    }
    .dark-mode .modal-content .close:hover,
    .dark-mode .modal-content .close:focus {
        color: #ddd;
    }

    </style>
</head>

<body>

    <!-- nav bar section -->
    {% include 'partials/nav.html' %}

    <!-- Flash message section -->
    {% include 'partials/flash.html' %}


    <div class="container">
        <div class ="box">
        <h2>Login</h2>
        <form id="loginForm" action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
                <span id = "togglePassword" style="cursor: pointer; color: #6f42c1; text-decoration: underline;">Show Password</span>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/register">Register</a></p>
        <p><a href="#" id = "forgotPasswordLink">Forgot Password?</a></p>
        </div>
    </div>

    <!-- Forgot password popup -->
     <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close" id = "closeForgotPasswordModal">&times;</span>
            <h2>Forgot Password</h2>
            <p>Enter your email to receive reset instructions:</p>
            <form id="forgotPasswordForm" action="/forgot_password" method="POST">
                <div class="form-group">
                    <!-- <label for="forgotEmail">Email</label>   -->
                    <input type="email" name="forgotEmail" id="forgotEmail" required>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        let isValid = true;

        //  Get form field
        const passwordField = document.getElementById('password');
        const emailField = document.getElementById('email');
        const emailPattern = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/; //regex

        // Reset classes
        emailField.classList.remove('error', 'valid');
        passwordField.classList.remove('error', 'valid');

        //Validate password length
        if (passwordField.value.length < 6) { //if password is less than 6 characters then it is an error
            passwordField.classList.add('error');
            isValid = false;
        } else {
            passwordField.classList.add('valid');
        }

        //Validate email pattern
        if (!emailPattern.test(emailField.value)) {
            emailField.classList.add('error');
            isValid = false;
        } else {
            emailField.classList.add('valid');
        }

        // // Prevents form from being submitted if any validation check fails.
        // if (!isValid) {
        //     event.preventDefault(); 
        // }
    });

    // Forgot password popup
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const closeForgotPasswordModal = document.getElementById('closeForgotPasswordModal');

    forgotPasswordLink.onclick = function() {
        forgotPasswordModal.style.display = 'block';
    }

    closeForgotPasswordModal.onclick = function() {
        forgotPasswordModal.style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target == forgotPasswordModal) {
            forgotPasswordModal.style.display = 'none';
        }
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const isPasswordVisible = passwordField.type === 'text';
            passwordField.type = isPasswordVisible ? 'password' : 'text';
            this.textContent = isPasswordVisible ? 'Show Password' : 'Hide Password'; // Toggle the text
        });

    function flashMessage(message, category) {
        const flashContainer = document.getElementById('frontend-flash');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('alert', 'alert-${category}');
        messageDiv.innerText = message;
        flashContainer.appendChild(messageDiv);
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
    clearInterval(serverStatusInterval); // Stop periodic checks during submission
    });


    // Define primary and backup server URLs
const primaryUrl = "http://10.147.17.11:7012/login"; // Primary server URL
const backupUrl = "http://10.147.17.65:7012/login"; // Backup server URL

// Track current server state
let isOnPrimary = window.location.href.startsWith(primaryUrl);
let isOnBackup = window.location.href.startsWith(backupUrl);

async function checkServerStatus() {
    let primaryIsOnline = false;
    let backupIsOnline = false;

    // Check the status of the primary server
    try {
        const primaryResponse = await fetch(primaryUrl, {
            method: "HEAD", // Use HEAD request for lightweight checks
            cache: "no-store", // Avoid cached responses
        });
        primaryIsOnline = primaryResponse.ok || primaryResponse.status === 200;
    } catch {
        console.info("Primary server is unreachable (expected during startup).");
    }

    // Check the status of the backup server
    try {
        const backupResponse = await fetch(backupUrl, {
            method: "HEAD", // Use HEAD request for lightweight checks
            cache: "no-store",
        });
        backupIsOnline = backupResponse.ok || backupResponse.status === 200;
    } catch {
        console.info("Backup server is unreachable (expected during startup).");
    }

    // Logic to decide redirection
    if (primaryIsOnline && !isOnPrimary) {
        console.log("Redirecting to the primary server.");
        window.location.href = primaryUrl; // Hard reload to primary
    } else if (!primaryIsOnline && backupIsOnline && !isOnBackup) {
        console.log("Redirecting to the backup server.");
        window.location.href = backupUrl; // Hard reload to backup
    } else {
        console.log("No redirection needed. Current state is stable.");
    }

    // Update flags
    isOnPrimary = primaryIsOnline;
    isOnBackup = backupIsOnline && !primaryIsOnline;
}

    // Call this function periodically or on certain triggers
    setInterval(checkServerStatus, 7000); // Poll every 7 seconds

    // Initial check when the page loads
    window.onload = checkServerStatus;


</script>
</body>

</html>
