<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register_login.css">
    <title> Login </title>
    <style>

        /* Style for error and valid input fields */
        .error {
            border-color: red;
            background-color: #f8d7da;
        }
        .valid {
            border-color: green;
            background-color: #d4edda;
        }

        /* Style for forgot password popup */
        .modal {
        display: none; 
        position: fixed; 
        z-index: 1000; 
        left: 0;
        top: 0;
        width: 100%; 
        height: 100%; 
        overflow: none;
        background-color: rgba(0, 0, 0, 0.5); /* Black with opacity */
    }
    .modal-content {
        background-color: #fefefe;
        margin: 15% auto;
        padding: 20px;
        border: 1px solid #888;
        width: 90%;
        max-width: 25%;
        text-align: center;
    }
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .close:hover,
    .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
    }

    /* Dark mode styling */
    .dark-mode {
        background-color: #1a1a24;
        color: #f4f5f7;
    }
    .dark-mode .modal-content {
        background-color: #333;
        color: #f4f5f7;
        border: 1px solid #555;
    }
    .dark-mode .modal-content .close {
        color: #f4f5f7;
    }
    .dark-mode .modal-content .close:hover,
    .dark-mode .modal-content .close:focus {
        color: #ddd;
    }

    </style>
</head>

<body>

    <!-- nav bar section -->
    {% include 'partials/nav.html' %}

    <!-- Flash message section -->
    {% include 'partials/flash.html' %}


    <div class="container">
        <div class ="box">
        <h2>Login</h2>
        <form id="loginForm" action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
                <span id = "togglePassword" style="cursor: pointer; color: #6f42c1; text-decoration: underline;">Show Password</span>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/register">Register</a></p>
        <p><a href="#" id = "forgotPasswordLink">Forgot Password?</a></p>
        </div>
    </div>

    <!-- Forgot password popup -->
     <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close" id = "closeForgotPasswordModal">&times;</span>
            <h2>Forgot Password</h2>
            <p>Enter your email to receive reset instructions:</p>
            <form id="forgotPasswordForm" action="/forgot_password" method="POST">
                <div class="form-group">
                    <!-- <label for="forgotEmail">Email</label>   -->
                    <input type="email" name="forgotEmail" id="forgotEmail" required>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        let isValid = true;

        //  Get form field
        const passwordField = document.getElementById('password');
        const emailField = document.getElementById('email');
        const emailPattern = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/; //regex

        // Reset classes
        emailField.classList.remove('error', 'valid');
        passwordField.classList.remove('error', 'valid');

        //Validate password length
        if (passwordField.value.length < 6) { //if password is less than 6 characters then it is an error
            passwordField.classList.add('error');
            isValid = false;
        } else {
            passwordField.classList.add('valid');
        }

        //Validate email pattern
        if (!emailPattern.test(emailField.value)) {
            emailField.classList.add('error');
            isValid = false;
        } else {
            emailField.classList.add('valid');
        }

        // // Prevents form from being submitted if any validation check fails.
        // if (!isValid) {
        //     event.preventDefault(); 
        // }
    });

    // Forgot password popup
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    const closeForgotPasswordModal = document.getElementById('closeForgotPasswordModal');

    forgotPasswordLink.onclick = function() {
        forgotPasswordModal.style.display = 'block';
    }

    closeForgotPasswordModal.onclick = function() {
        forgotPasswordModal.style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target == forgotPasswordModal) {
            forgotPasswordModal.style.display = 'none';
        }
    }

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const isPasswordVisible = passwordField.type === 'text';
            passwordField.type = isPasswordVisible ? 'password' : 'text';
            this.textContent = isPasswordVisible ? 'Show Password' : 'Hide Password'; // Toggle the text
        });

    function flashMessage(message, category) {
        const flashContainer = document.getElementById('frontend-flash');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('alert', 'alert-${category}');
        messageDiv.innerText = message;
        flashContainer.appendChild(messageDiv);
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {

    });


        // Define server URLs and priorities
        const servers = [
            { url: "http://100.64.1.5:7012", name: "primary" },
            { url: "http://100.64.1.4:7012", name: "backup" },
            { url: "http://100.64.1.2:7012", name: "jose" },
            { url: "http://100.64.1.1:7012", name: "moe" },
            { url: "http://100.64.1.3:7012", name: "kev" }
        ];
    
        let currentServer = null; // Tracks the current active server
        let isRedirecting = false; // Prevents multiple redirects
        const redirectedUrlKey = "redirected_server"; // Key for localStorage to store the last redirected URL
    
        // Check if a server is reachable
        async function isServerOnline(server) {
            try {
                // Add timestamp to avoid caching issues
                const response = await fetch(`${server.url}?timestamp=${Date.now()}`, {
                    method: "GET",
                    mode: "no-cors", // Avoid CORS issues
                    cache: "no-store" // Prevent cached responses
                });
    
                console.log(`${server.name} server check performed.`);
                return true; // Assume online if no error occurs
            } catch (error) {
                console.error(`${server.name} server is unreachable:`, error);
                return false;
            }
        }
    
        // Main function to check servers
        async function checkServerStatus() {
            if (isRedirecting) return; // Skip checks if redirection is ongoing
    
            // If the current server is set, revalidate it
            if (currentServer) {
                const currentServerObj = servers.find(server => server.name === currentServer);
                if (currentServerObj) {
                    const isOnline = await isServerOnline(currentServerObj);
                    if (isOnline) {
                        console.log(`Current server (${currentServer}) is still online.`);
                        return; // Stay on the current server
                    } else {
                        console.warn(`Current server (${currentServer}) is no longer reachable.`);
                        currentServer = null; // Mark as offline
                    }
                }
            }
    
            // Look for the next available server
            for (const server of servers) {
                const isOnline = await isServerOnline(server);
                if (isOnline) {
                    // Check if the server we're trying to redirect to is different from the last redirected one
                    const lastRedirectedUrl = localStorage.getItem(redirectedUrlKey);
                    if (server.url !== lastRedirectedUrl) {
                        console.log(`Switching to ${server.name.charAt(0).toUpperCase() + server.name.slice(1)} server.`);
                        isRedirecting = true; // Prevent further checks during redirection
                        currentServer = server.name; // Update current server
                        localStorage.setItem(redirectedUrlKey, server.url); // Save the redirected server URL to localStorage
                        updateActiveServer(server.url); // Handle switching logic
                    }
                    return; // Stop after finding the first available server
                } else {
                    console.log(`${server.name} server is offline.`);
                }
            }
    
            console.warn("No servers are currently reachable.");
        }
    
        // Handle logic for switching servers
        function updateActiveServer(serverUrl) {
            console.log(`Redirecting to: ${serverUrl}`);
            window.location.href = serverUrl; // Perform the actual redirection
            isRedirecting = false; // Reset the flag after redirect
        }
    
        // Poll server status every 7 seconds
        setInterval(checkServerStatus, 7000);
    
        // Initial check on page load
        window.onload = () => {
            const lastRedirectedUrl = localStorage.getItem(redirectedUrlKey);
            if (lastRedirectedUrl) {
                // If the page was redirected previously, prevent checking servers unnecessarily
                currentServer = servers.find(server => server.url === lastRedirectedUrl)?.name || null;
            }
            checkServerStatus();
        };


</script>
</body>

</html>
