<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/register_login.css"> <!-- Links to css--> 
    <title> Register </title>
    <style>
        .error {
            border-color: red;
            background-color: #f8d7da;
        }
        .valid {
            border-color: green;
            background-color: #d4edda;
        }
    </style>
</head>

<body>

    <!-- nav bar section -->
    {% include 'partials/nav.html' %}

    <!-- Flash message section -->
    {% include 'partials/flash.html' %}

    <div id="frontend-flash"></div>

    <div class="container">
        <div class = "box">
        <h2>Register</h2>
        <form id="registrationForm" action="/register" method="POST">
            <div class = "form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class = "form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required>
            </div>
            <div class = "form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
                <span id = "togglePassword" style="cursor: pointer; color: #6f42c1; text-decoration: underline;">Show Password</span>
            </div>
            <div class = "form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required>
                <span id = "toggleConfirmPassword" style="cursor: pointer; color: #6f42c1; text-decoration: underline;">Show Password</span>
            </div>
            
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login">Login</a></p>
    </div>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
        let isValid = true;

        //  Get form field
        const passwordField = document.getElementById('password');
        const emailField = document.getElementById('email');
        const usernameField = document.getElementById('username');
        const confirm_password = document.getElementById('confirm_password');
        const emailPattern = /^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$/; //regex

        // Reset classes
        emailField.classList.remove('error', 'valid');
        passwordField.classList.remove('error', 'valid');
        confirm_password.classList.remove('error', 'valid');

        //Validate password length
        if (passwordField.value.length < 6) { //if password is less than 6 characters then it is an error
            passwordField.classList.add('error');
            isValid = false;
        } else {
            passwordField.classList.add('valid');
        }

        //Validate email pattern
        if (!emailPattern.test(emailField.value)) {
            emailField.classList.add('error');
            isValid = false;
        } else {
            emailField.classList.add('valid');
        }
        
        //Validate that password and confirm password match
        if (passwordField.value !== confirm_password.value) {
            confirm_password.classList.add('error');
            isValid = false;
        } else {
            confirm_password.classList.add('valid');
        }

        // Prevents form from being submitted if any validation check fails.
        if (!isValid) {
            event.preventDefault(); 
        }
    });

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordField = document.getElementById('password');
            const isPasswordVisible = passwordField.type === 'text';
            passwordField.type = isPasswordVisible ? 'password' : 'text';
            this.textContent = isPasswordVisible ? 'Show Password' : 'Hide Password'; // Toggle the text
        });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
        const confirmPasswordField = document.getElementById('confirm_password');
        const isConfirmPasswordVisible = confirmPasswordField.type === 'text';
        confirmPasswordField.type = isConfirmPasswordVisible ? 'password' : 'text';
        this.textContent = isConfirmPasswordVisible ? 'Show Password' : 'Hide Password'; // Toggle the text
    });

    function flashMessage(message, category) {
        const flashContainer = document.getElementById('frontend-flash');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('alert', 'alert-${category}');
        messageDiv.innerText = message;
        flashContainer.appendChild(messageDiv);
    }

        // Define primary and backup server URLs
    const primaryUrl = "http://100.64.1.5:7012/register"; // Primary server URL
    const backupUrl = "http://100.64.1.4:7012/register"; // Backup server URL

    // Track the current server state
    let currentServer = window.location.href.startsWith(primaryUrl) ? "primary" : "backup";

    // Track the status of the servers to avoid repetitive logs
    let previousPrimaryStatus = "unknown";
    let previousBackupStatus = "unknown";

    // Function to check if a server is online
    async function fetchServerStatus(url) {
        try {
            await fetch(url, {
                method: "GET",
                mode: "no-cors", // Avoid CORS issues
                cache: "no-store", // Prevent cached responses
            });
            return true; // Assume the server is reachable if no error occurs
        } catch (error) {
            console.error(`Error reaching server (${url}):`, error);
            return false;
        }
    }

    // Function to check the server statuses and handle redirection
    async function checkServerStatus() {
        console.log("Checking server statuses...");

        // Check the status of the primary server
        const isPrimaryOnline = await fetchServerStatus(primaryUrl);
        if (isPrimaryOnline) {
            if (previousPrimaryStatus !== "online") {
                console.log("Primary server is online.");
                previousPrimaryStatus = "online";
            }
        } else {
            if (previousPrimaryStatus !== "offline") {
                console.warn("Primary server is offline.");
                previousPrimaryStatus = "offline";
            }
        }

        // Check the status of the backup server
        const isBackupOnline = await fetchServerStatus(backupUrl);
        if (isBackupOnline) {
            if (previousBackupStatus !== "online") {
                console.log("Backup server is online.");
                previousBackupStatus = "online";
            }
        } else {
            if (previousBackupStatus !== "offline") {
                console.warn("Backup server is offline.");
                previousBackupStatus = "offline";
            }
        }

        // Redirect logic
        if (!isPrimaryOnline && currentServer === "primary" && isBackupOnline) {
            console.log("Primary is down, switching to the backup server...");
            window.location.href = backupUrl; // Redirect to backup
            currentServer = "backup";
        } else if (!isBackupOnline && currentServer === "backup" && isPrimaryOnline) {
            console.log("Backup is down, switching back to the primary server...");
            window.location.href = primaryUrl; // Redirect to primary
            currentServer = "primary";
        } else if (!isPrimaryOnline && !isBackupOnline) {
            console.error("Both servers are unreachable!");
        }
    }

    // Poll the server statuses every 5 seconds
    setInterval(checkServerStatus, 5000);

    // Initial check when the page loads
    window.addEventListener("load", checkServerStatus);

</script>

</body>

</html>
