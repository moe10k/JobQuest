<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
                // Define primary and backup server URLs
        const primaryUrl = "http://100.64.1.5:7012/landing"; // Primary server URL
        const backupUrl = "http://100.64.1.4:7012/landing"; // Backup server URL

        // Track the current server state
        let currentServer = window.location.href.startsWith(primaryUrl) ? "primary" : "backup";

        // Track the status of the servers to avoid repetitive logs
        let previousPrimaryStatus = "unknown";
        let previousBackupStatus = "unknown";

        // Function to check if a server is online
        async function fetchServerStatus(url) {
            try {
                await fetch(url, {
                    method: "GET",
                    mode: "no-cors", // Avoid CORS issues
                    cache: "no-store", // Prevent cached responses
                });
                return true; // Assume the server is reachable if no error occurs
            } catch (error) {
                console.error(`Error reaching server (${url}):`, error);
                return false;
            }
        }

        // Function to check the server statuses and handle redirection
        async function checkServerStatus() {
            console.log("Checking server statuses...");

            // Check the status of the primary server
            const isPrimaryOnline = await fetchServerStatus(primaryUrl);
            if (isPrimaryOnline) {
                if (previousPrimaryStatus !== "online") {
                    console.log("Primary server is online.");
                    previousPrimaryStatus = "online";
                }
            } else {
                if (previousPrimaryStatus !== "offline") {
                    console.warn("Primary server is offline.");
                    previousPrimaryStatus = "offline";
                }
            }

            // Check the status of the backup server
            const isBackupOnline = await fetchServerStatus(backupUrl);
            if (isBackupOnline) {
                if (previousBackupStatus !== "online") {
                    console.log("Backup server is online.");
                    previousBackupStatus = "online";
                }
            } else {
                if (previousBackupStatus !== "offline") {
                    console.warn("Backup server is offline.");
                    previousBackupStatus = "offline";
                }
            }

            // Redirect logic
            if (!isPrimaryOnline && currentServer === "primary" && isBackupOnline) {
                console.log("Primary is down, switching to the backup server...");
                window.location.href = backupUrl; // Redirect to backup
                currentServer = "backup";
            } else if (!isBackupOnline && currentServer === "backup" && isPrimaryOnline) {
                console.log("Backup is down, switching back to the primary server...");
                window.location.href = primaryUrl; // Redirect to primary
                currentServer = "primary";
            } else if (!isPrimaryOnline && !isBackupOnline) {
                console.error("Both servers are unreachable!");
            }
        }

        // Poll the server statuses every 5 seconds
        setInterval(checkServerStatus, 5000);

        // Initial check when the page loads
        window.addEventListener("load", checkServerStatus);
    </script>

</body>
</html>
