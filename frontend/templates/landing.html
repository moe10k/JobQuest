<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
        // Define primary, backup, and new node server URLs
        const primaryUrl = "http://100.64.1.5:7012"; // Primary server URL
        const backupUrl = "http://100.64.1.4:7012"; // Backup server URL
        const joseUrl = "http://100.64.1.2:7012"; // Jose's server URL
        const moeUrl = "http://100.64.1.1:7012"; // Moe's server URL
        const kevUrl = "http://100.64.1.3:7012"; // Kev's server URL
    
        // Track the current server state
        let currentServer = ""; // Will hold current server name (primary, backup, jose, moe, kev)
    
        // Function to check the status of the primary, backup, and new nodes
        async function checkServerStatus() {
            try {
                // Attempt to check the primary server's status
                const primaryResponse = await fetch(primaryUrl, {
                    method: "GET", 
                    mode: "no-cors",  // Set to no-cors mode to avoid CORS-related issues
                    cache: "no-store", // Avoid cached responses
                });
    
                // If the primary server is online, handle redirection
                if (primaryResponse.ok || primaryResponse.status === 200) {
                    console.log("Primary server is online.");
                    // Redirect to primary if user is on backup or another server
                    if (currentServer !== 'primary') {
                        console.log("Redirecting to the primary server.");
                        window.location.href = primaryUrl;
                        currentServer = 'primary';
                    }
                } else {
                    console.warn("Primary server is down (unexpected response).");
                    switchToBackup();
                }
            } catch (error) {
                // Handle network errors or fetch failures for primary server
                console.error("Primary server is unreachable:", error);
                switchToBackup();
            }
    
            // Check if the backup server is online
            try {
                const backupResponse = await fetch(backupUrl, {
                    method: "GET", 
                    mode: "no-cors",  // Set to no-cors mode for backup server
                    cache: "no-store", 
                });
    
                if (backupResponse.ok || backupResponse.status === 200) {
                    console.log("Backup server is online.");
                    // If user is on backup and it's reachable, do nothing
                    if (currentServer !== 'backup') {
                        console.log("Redirecting to the backup server.");
                        window.location.href = backupUrl;
                        currentServer = 'backup';
                    }
                } else {
                    console.warn("Backup server is down (unexpected response).");
                    // Redirect to primary if backup is down and user is on backup
                    if (currentServer === 'backup') {
                        console.log("Backup is down, redirecting to primary server.");
                        window.location.href = primaryUrl; // Redirect to primary
                        currentServer = 'primary';
                    }
                }
            } catch (error) {
                // Handle network errors or fetch failures for backup server
                console.error("Backup server is unreachable:", error);
                // Redirect to primary if backup is down and user is on backup
                if (currentServer === 'backup') {
                    console.log("Backup is down, redirecting to primary server.");
                    window.location.href = primaryUrl; // Redirect to primary
                    currentServer = 'primary';
                }
            }
    
            // If both primary and backup servers are down, switch to the new nodes
            switchToBackup();
        }
    
        // Function to switch to the backup or the next available server (Jose, Moe, Kev)
        function switchToBackup() {
            // Array of all servers in order of priority
            const servers = [
                { url: backupUrl, name: 'backup' }, // Backup server
                { url: joseUrl, name: 'jose' },     // Jose's server
                { url: moeUrl, name: 'moe' },       // Moe's server
                { url: kevUrl, name: 'kev' }        // Kev's server
            ];
    
            // Find the first available server that the user is not already on
            for (const server of servers) {
                if (currentServer !== server.name) {
                    console.log(`Switching to the ${server.name.charAt(0).toUpperCase() + server.name.slice(1)} server.`);
                    window.location.href = server.url; // Redirect to the first available server
                    currentServer = server.name; // Update the current server state
                    break; // Exit loop after redirection
                }
            }
        }
    
        // Poll the server status every 7 seconds
        setInterval(checkServerStatus, 7000);
    
        // Initial check when the page loads
        window.onload = checkServerStatus;
    </script>
    

</body>
</html>
