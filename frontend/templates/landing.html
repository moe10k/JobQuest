<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
    // Define primary and backup server URLs
    const primaryUrl = "http://10.147.17.11:7012/login"; // Primary server URL
    const backupUrl = "http://10.147.17.65:7012/login"; // Backup server URL

    // Track current server state
    let isOnPrimary = window.location.href.startsWith(primaryUrl);
    let isOnBackup = window.location.href.startsWith(backupUrl);

    // Function to check the status of the primary server
    async function checkServerStatus() {
        try {
            // Attempt to check the primary server's status
            const response = await fetch(primaryUrl, {
                method: "GET", 
                mode: "no-cors", // Prevent CORS-related issues
                cache: "no-store", // Avoid cached responses
            });

            // If the primary server is online, handle redirection
            if (response.ok || response.status === 200) {
                console.log("Primary server is online.");
                // Redirect to primary if user is on backup
                if (isOnBackup) {
                    console.log("Redirecting back to the primary server.");
                    window.location.href = primaryUrl; // Use href for hard reload
                }
                isOnPrimary = true;
                isOnBackup = false;
            } else {
                console.warn("Primary server is down (unexpected response).");
                switchToBackup();
            }
        } catch (error) {
            // Handle network errors or fetch failures
            console.error("Primary server is unreachable:", error);
            switchToBackup();
        }
    }

    // Function to redirect to the backup server
    function switchToBackup() {
        if (!isOnBackup) {
            console.log("Switching to the backup server.");
            window.location.href = backupUrl; // Hard reload to backup
        }
        isOnPrimary = false;
        isOnBackup = true;
    }

    // Poll the server status every 5 seconds
    setInterval(checkServerStatus, 5000);

    // Initial check when the page loads
    window.onload = checkServerStatus;

</script>

</body>
</html>
