<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
        // Define server URLs and priorities
        const servers = [
            { url: "http://100.64.1.5:7012", name: "primary" },
            { url: "http://100.64.1.4:7012", name: "backup" },
            { url: "http://100.64.1.2:7012", name: "jose" },
            { url: "http://100.64.1.1:7012", name: "moe" },
            { url: "http://100.64.1.3:7012", name: "kev" }
        ];
    
        let currentServer = null; // Tracks the current active server
        let isRedirecting = false; // Prevents multiple redirects
    
        // Function to check if a server is reachable
        async function isServerOnline(server) {
            try {
                const response = await fetch(server.url, {
                    method: "GET",
                    mode: "no-cors", // Avoid CORS issues
                    cache: "no-store" // Prevent cached responses
                });
                return response.ok || response.status === 200;
            } catch (error) {
                console.error(`${server.name} server is unreachable:`, error);
                return false;
            }
        }
    
        // Main function to check servers
        async function checkServerStatus() {
            if (isRedirecting) return; // Skip checks if redirection is ongoing
    
            for (const server of servers) {
                if (currentServer === server.name) {
                    // If already on the current server, confirm it's still online
                    const isOnline = await isServerOnline(server);
                    if (!isOnline) {
                        console.warn(`${server.name} server is no longer reachable.`);
                        currentServer = null; // Mark current server as offline
                    } else {
                        console.log(`${server.name} server is active.`);
                        return; // Stay on the current server
                    }
                }
            }
    
            // Look for the first available server in priority order
            for (const server of servers) {
                const isOnline = await isServerOnline(server);
                if (isOnline) {
                    if (currentServer !== server.name) {
                        console.log(`Switching to ${server.name.charAt(0).toUpperCase() + server.name.slice(1)} server.`);
                        isRedirecting = true; // Prevent further checks during redirection
                        currentServer = server.name; // Update current server
                        updateActiveServer(server.url); // Handle switching logic
                    }
                    return; // Stop after finding the first available server
                }
            }
    
            console.warn("No servers are currently reachable.");
        }
    
        // Handle logic for switching servers without page reload
        function updateActiveServer(serverUrl) {
            console.log(`Updating active server to: ${serverUrl}`);
            // Example: Update application state, API base URL, etc.
            // Replace this with your application's handling logic
            // apiBaseUrl = serverUrl;
            isRedirecting = false; // Reset redirect flag
        }
    
        // Poll server status every 7 seconds
        setInterval(checkServerStatus, 7000);
    
        // Initial check on page load
        window.onload = checkServerStatus;
    </script>
    
    
    
    

</body>
</html>
