<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
                    // Define primary and backup server URLs
        const primaryUrl = "http://100.64.1.5:7012"; // Primary server URL
        const backupUrl = "http://100.64.1.4:7012"; // Backup server URL

        // Track current server state
        let currentServer = window.location.href.startsWith(primaryUrl) ? "primary" : "backup";

        // Log state changes to avoid flooding the console
        let previousServerStatus = "";

        // Function to fetch server status
        async function fetchServerStatus(url) {
            try {
                const response = await fetch(url, {
                    method: "GET",
                    mode: "no-cors", // Avoid CORS-related issues
                    cache: "no-store", // Prevent cached responses
                });
                return response.ok || response.status === 200;
            } catch (error) {
                // Only log the error if the server is unreachable
                if (!previousServerStatus.includes(`Error reaching server (${url})`)) {
                    console.error(`Error reaching server (${url}):`, error);
                }
                previousServerStatus = `Error reaching server (${url})`;
                return false;
            }
        }

        // Function to check server statuses and handle redirections
        async function checkServerStatus() {
            console.log("Checking server status...");

            // Check primary server
            const isPrimaryOnline = await fetchServerStatus(primaryUrl);
            if (isPrimaryOnline) {
                if (previousServerStatus !== "Primary server is online.") {
                    console.log("Primary server is online.");
                    previousServerStatus = "Primary server is online.";
                }

                if (currentServer === "backup") {
                    console.log("Redirecting to the primary server...");
                    window.location.href = primaryUrl;
                }
                currentServer = "primary";
                return;
            } else {
                // Log a warning only when the primary server is down, avoiding flooding
                if (previousServerStatus !== "Primary server is offline.") {
                    console.warn("Primary server is offline.");
                    previousServerStatus = "Primary server is offline.";
                }
            }

            // Check backup server
            const isBackupOnline = await fetchServerStatus(backupUrl);
            if (isBackupOnline) {
                if (previousServerStatus !== "Backup server is online.") {
                    console.log("Backup server is online.");
                    previousServerStatus = "Backup server is online.";
                }

                if (currentServer === "primary") {
                    console.log("Switching to the backup server...");
                    window.location.href = backupUrl;
                }
                currentServer = "backup";
            } else {
                // Log critical error only if both servers are unreachable
                if (previousServerStatus !== "Both servers are unreachable!") {
                    console.error("Both servers are unreachable!");
                    previousServerStatus = "Both servers are unreachable!";
                }
            }
        }

        // Poll the server status every 7 seconds
        setInterval(checkServerStatus, 7000);

        // Initial check when the page loads
        window.addEventListener("load", checkServerStatus);
    </script>

</body>
</html>
