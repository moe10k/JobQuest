<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
    // Function to check the server status
    function checkServerStatus() {
    const primaryUrl = "http://10.147.17.11:7012";  // Primary server URL
    const backupUrl = "http://10.147.17.65:7012";   // Backup server URL

    fetch(primaryUrl, { method: "HEAD" })
        .then(response => {
            if (!response.ok) {
                // Primary server is down, redirect to backup
                if (window.location.href !== backupUrl) {
                    window.location.href = backupUrl;
                }
            } else {
                // Primary server is up, redirect from backup to primary
                if (window.location.href !== primaryUrl) {
                    window.location.href = primaryUrl;
                }
            }
        })
        .catch(error => {
            // If primary server is unreachable, redirect to backup
            console.error("Primary server unreachable:", error);
            if (window.location.href !== backupUrl) {
                window.location.href = backupUrl;
            }
        });
    }

    // Call the function when the page is loaded
    window.onload = checkServerStatus;

    </script>
</body>
</html>
