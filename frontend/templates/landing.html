<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/landing.css"> <!-- Links to css-->
    <title> Landing </title>
</head>
<body>
    
    <!-- nav bar section -->
    {% include 'partials/nav.html' %}
    
    <div class="content">
        <div class="welcome-section">
            <h1>Welcome to JobQuest</h1>
            <p>Your next career starts here.</p>
            <a href="/register" class="btn">Get Started</a>
            <p>Already have an account? <a href="/login">Log in here.</a></p>
        </div>
        <div class="image-section">
            <img src ="static/images/Job.png" alt = "JobQuest Logo" class = "responsive-image">
        </div>
    </div>

    <script>
        // Define server URLs
        const primaryUrl = "http://100.64.1.5:7012"; // Primary server URL
        const backupUrl = "http://100.64.1.4:7012"; // Backup server URL
        const joseUrl = "http://100.64.1.2:7012";   // Jose's server URL
        const moeUrl = "http://100.64.1.1:7012";    // Moe's server URL
        const kevUrl = "http://100.64.1.3:7012";    // Kev's server URL
    
        // Track the current server state
        let currentServer = ""; // Will hold current server name (primary, backup, etc.)
        let isRedirecting = false; // Prevent multiple redirects simultaneously
    
        // Function to check the status of a server
        async function checkServer(url) {
            try {
                const response = await fetch(url, {
                    method: "GET",
                    mode: "no-cors", // Avoid CORS issues
                    cache: "no-store" // Prevent cached responses
                });
                return response.ok || response.status === 200;
            } catch (error) {
                console.error(`Server at ${url} is unreachable:`, error);
                return false;
            }
        }
    
        // Main function to handle server checks and redirection
        async function checkServerStatus() {
            if (isRedirecting) return; // Skip if a redirection is already in progress
    
            // Server priority list
            const servers = [
                { url: primaryUrl, name: "primary" },
                { url: backupUrl, name: "backup" },
                { url: joseUrl, name: "jose" },
                { url: moeUrl, name: "moe" },
                { url: kevUrl, name: "kev" }
            ];
    
            // Iterate through servers and find the first available one
            for (const server of servers) {
                const isOnline = await checkServer(server.url);
                if (isOnline) {
                    if (currentServer !== server.name) {
                        console.log(`Switching to ${server.name.charAt(0).toUpperCase() + server.name.slice(1)} server.`);
                        isRedirecting = true; // Prevent further checks during redirection
                        currentServer = server.name; // Update current server
                        window.location.href = server.url; // Redirect
                    } else {
                        console.log(`${server.name.charAt(0).toUpperCase() + server.name.slice(1)} server is active.`);
                    }
                    return; // Stop checking once an active server is found
                }
            }
    
            console.warn("No servers are currently reachable.");
        }
    
        // Poll the server status every 7 seconds
        setInterval(checkServerStatus, 7000);
    
        // Initial check on page load
        window.onload = checkServerStatus;
    </script>
    
    

</body>
</html>
